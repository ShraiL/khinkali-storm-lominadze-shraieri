services:
  game:
    build: ./game
    container_name: khinkali-game
    ports: ["8080:80"]
    networks: [khinkali-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
  leaderboard:
    build: ./leaderboard
    container_name: khinkali-leaderboard
    volumes: ["leaderboard-data:/data"]
    networks: [khinkali-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  khinkali-net:
volumes:
  leaderboard-data:
